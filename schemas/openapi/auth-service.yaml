openapi: 3.0.3
info:
  title: Auth Service API
  version: 1.0.0
  description: Authentication and authorization service for Smart Home ecosystem.

servers:
  - url: http://localhost:8081

tags:
  - name: Auth
  - name: Users

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Invalid credentials
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshResponse' }
        '401':
          description: Invalid refresh token
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user (revoke refresh tokens)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /me:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /me/homes:
    get:
      tags: [Users]
      summary: List user home memberships
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of memberships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HomeMembership' }
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: user@example.com }
        password: { type: string, minLength: 8, example: StrongPass123! }

    RegisterResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    RefreshResponse:
      type: object
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }

    UserProfile:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [ACTIVE, BLOCKED, DELETED] }
        createdAt: { type: string, format: date-time }

    HomeMembership:
      type: object
      properties:
        homeId: { type: string, format: uuid }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER, GUEST] }
        joinedAt: { type: string, format: date-time }

    ProblemDetails:
      type: object
      properties:
        type: { type: string, example: "https://example.com/errors/validation" }
        title: { type: string, example: "Validation error" }
        status: { type: integer, example: 400 }
        detail: { type: string, example: "Email already exists" }
        traceId: { type: string, example: "00-abc123..." }
